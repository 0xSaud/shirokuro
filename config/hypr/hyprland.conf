################################################################################
#  Hyprland config — cleaned & organized for daily use
#  (backup of your previous config: ~/.config/hypr/hyprland.conf.pre-claude.*)
################################################################################

# ------------------------------------------------------------------ Monitors
monitor=eDP-1, preferred, 0x0, 1
monitor=HDMI-A-1, preferred, 1920x0, 1

# ------------------------------------------------------------------ Environment
env = XDG_MENU_PREFIX,arch-
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# ------------------------------------------------------------------ Autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME
# exec-once = waybar          # replaced by Quickshell (config kept for rollback)
exec-once = ~/.config/hypr/scripts/start-shell.sh
# exec-once = dunst   # replaced by Quickshell notification server
exec-once = sh -c 'command -v swww-daemon >/dev/null && exec swww-daemon || exec awww-daemon'
exec-once = ~/.config/themes/bin/restore-session.sh   # restores saved theme + wallpaper
exec-once = /usr/libexec/kf6/polkit-kde-authentication-agent-1
exec-once = nm-applet --indicator
# Clipboard manager — records history so values copied in Burp/Xwayland can be
# pasted into Wayland apps (and vice-versa) via the Super+Shift+V picker.
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Idle management: auto lock / screen-off / suspend (config: hypridle.conf)
exec-once = hypridle
# NOTE: gnome-keyring is started & unlocked by SDDM/PAM at login.
#       Do NOT start it again here — that was causing the keyring password prompt.

$mainMod = SUPER

# ------------------------------------------------------------------ Apps & WM
bind = $mainMod, Q, exec, kitty
bind = $mainMod, E, exec, dolphin
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = CTRL, B, exec, qs ipc call panels clipboard   # clipboard history (was rofi; script kept as fallback)
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, exec, ~/.config/themes/bin/power-profile.sh cycle   # cycle Eco -> Balanced -> Performance
bind = $mainMod ALT, P, pseudo,    # dwindle pseudotile (moved off SUPER+P)
bind = $mainMod, S, layoutmsg, togglesplit   # moved off J (J is now window-focus-down)
bind = $mainMod SHIFT, R, exec, hyprctl reload   # reload this config live

# --- Application launcher (KEPT as you asked: ALT + Space) ---
# Now the Quickshell launcher. To go back to rofi, comment this and uncomment below.
bind = ALT, space, exec, qs ipc call panels launcher
# bind = ALT, space, exec, rofi -show drun -theme ~/.config/rofi/launcher.rasi

# --- Dual-screen master switch (KEPT as you asked: END key) ---
bind = , END, exec, ~/.config/hypr/scripts/dual-screen-toggle.sh

# --- Theme / wallpaper / GIF / power menus ---
bind = $mainMod, T,      exec, qs ipc call panels theme
bind = $mainMod, W,      exec, qs ipc call panels wallpaper
bind = $mainMod, G,      exec, qs ipc call panels gif
bind = $mainMod, I,      exec, qs ipc call panels settings
bind = $mainMod, A,      exec, qs ipc call panels audio
# SUPER+B hides / shows the bar (Bluetooth moved: control centre -> Bluetooth).
bind = $mainMod, B,      exec, qs ipc call panels bar
bind = $mainMod, D,      exec, qs ipc call panels calendar
bind = $mainMod, slash,  exec, qs ipc call panels keys          # keybind cheatsheet
bind = ALT, Tab,         exec, qs ipc call panels windows       # window switcher

# --- Screen recording (wf-recorder) ---
bind = $mainMod ALT, R,  exec, qs ipc call panels recordRegion
bind = $mainMod ALT, S,  exec, qs ipc call panels recordScreen
bind = $mainMod ALT, X,  exec, qs ipc call panels recordStop
# Power menu is now the Quickshell panel; the rofi one is still at power-menu.sh
bind = $mainMod, Escape, exec, qs ipc call panels power
# bind = $mainMod, Escape, exec, ~/.config/themes/bin/power-menu.sh

# --- Side panels (xenon-style slide-in, right) ---
bind = $mainMod, N, exec, qs ipc call panels cc
bind = $mainMod, O, exec, qs ipc call panels music

# --- Keyboard layout: toggle English <-> Arabic ---
# bindl (not bind) so it still works on the lock screen: a plain bind is ignored
# while the session is locked, which left the password field stuck in Arabic.
bindl = $mainMod, space, exec, hyprctl switchxkblayout all next

# ------------------------------------------------------------------ Screenshots
#  PrintScreen            -> select region, annotate in swappy, save + copy
#  Super + Shift + S      -> same as above (familiar shortcut)
#  Super + PrintScreen    -> active window, save + copy
#  Shift + PrintScreen    -> whole monitor, save + copy
#  Ctrl  + PrintScreen    -> region to clipboard only (no file/editor)
#  Files land in ~/Pictures/Screenshots
bind = , Print,            exec, ~/.config/hypr/scripts/screenshot.sh region
bind = $mainMod SHIFT, S,  exec, ~/.config/hypr/scripts/screenshot.sh region
bind = $mainMod, Print,    exec, ~/.config/hypr/scripts/screenshot.sh window
bind = SHIFT, Print,       exec, ~/.config/hypr/scripts/screenshot.sh screen
bind = CTRL, Print,        exec, ~/.config/hypr/scripts/screenshot.sh regioncp

# --- Color picker (hex copied to clipboard) ---
bind = $mainMod SHIFT, P,  exec, hyprpicker -a

# ------------------------------------------------------------------ Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

workspace = 1, monitor:eDP-1
# 11 and 12 are the END-key "other desktop" (they used to be 9 and 10, which
# are ordinary workspaces now that SUPER+1..0 covers 1-10).
workspace = 11, monitor:eDP-1
workspace = 2, monitor:HDMI-A-1
workspace = 12, monitor:HDMI-A-1

# ------------------------------------------------------------------ Focus / move
# Window focus moved to vim keys (arrows now control brightness/volume)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Per-screen brightness — point mouse at the screen, then Super + Up/Down
bind  = $mainMod, up,   exec, ~/.config/hypr/scripts/brightness.sh up
bind  = $mainMod, down, exec, ~/.config/hypr/scripts/brightness.sh down

# Volume — Super + Right/Left (hold to slide)
binde = $mainMod, right, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = $mainMod, left,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ------------------------------------------------------------------ Brightness
# Internal laptop panel (saves to brightness.json so it persists across reboots)
bind = , XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/brightness.sh laptop-rel 10
bind = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh laptop-rel -10
# External LG monitor over HDMI — hold ALT with the brightness keys
bind = ALT, XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/brightness.sh external-rel 10
bind = ALT, XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh external-rel -10

# ------------------------------------------------------------------ Volume
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# ------------------------------------------------------------------ Keyboard
input {
    kb_layout = us,ara
    # Super+Space cycles us <-> ara (see bind above). Bar shows nothing special;
    # check active layout with: hyprctl devices | grep active_keymap
}

# ------------------------------------------------------------------ Look & feel
# "Ink" look: black lacquer windows with a hairline frame. The focused window
# gets a pale steel line, the rest a dark one; the red accent is kept for the
# bar and panels. Colours are generated into theme.conf by apply-colors.sh.
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(e4e2e2cc)
    col.inactive_border = rgba(363434ff)
    layout = dwindle
}

decoration {
    rounding = 8
    dim_inactive = true
    dim_strength = 0.12
    blur {
        enabled = true
        size = 5
        passes = 2
        noise = 0.03
        contrast = 1.0
        brightness = 0.9
    }
    shadow {
        enabled = true
        sharp = false
        range = 22
        render_power = 3
        offset = 0 6
        color = rgba(000000aa)
        color_inactive = rgba(00000055)
    }
}

# ------------------------------------------------------------------ Motion
# Durations are in centiseconds (10 = 100ms). Short, decelerating curves read
# as "fast and smooth"; long ones read as floaty. Tuned for the Intel iGPU
# driving both 1080p screens, so nothing here is expensive to draw.
bezier = easeOutQuint, 0.23, 1,   0.32, 1
bezier = easeOutCubic, 0.33, 1,   0.68, 1
bezier = almostLinear, 0.5,  0.5, 0.75, 1
bezier = quick,        0.15, 0,   0.1,  1

animations {
    enabled = true

    animation = global,     1, 6,   default
    animation = border,     1, 5.4, easeOutQuint
    animation = windows,    1, 4.8, easeOutQuint
    # A quick, short draw: windows come up from just below their place.
    animation = windowsIn,  1, 3.2, easeOutQuint, popin 96%
    animation = windowsOut, 1, 1.4, easeOutQuint, popin 96%
    animation = fadeIn,     1, 1.7, almostLinear
    animation = fadeOut,    1, 1.5, almostLinear
    animation = fade,       1, 3,   quick
    animation = layers,     1, 3.8, easeOutQuint
    animation = layersIn,   1, 4,   easeOutQuint, fade
    animation = layersOut,  1, 1.5, linear, fade
    animation = workspaces, 1, 2.8, easeOutQuint, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    initial_workspace_tracking = 0
}

cursor {
    # Force software cursors. On this Intel+NVIDIA hybrid GPU with dual monitors,
    # the hardware cursor plane on the idle screen isn't cleared, leaving a frozen
    # "ghost" cursor stuck in the middle of the laptop screen at login. Software
    # cursors render per-frame and don't leave that artifact.
    no_hardware_cursors = true
}

# ------------------------------------------------------------------ Window rules
# pavucontrol as a floating glass sidebar, top-right
windowrule {
    name        = pavucontrol-sidebar
    match {
        class = pavucontrol
    }
    float       = true
    move        = monitor_w-410 50
    size        = 400 500
    opacity     = 0.90 0.90
    border_size = 0
    rounding    = 15
    pin         = true
    animation   = slide right
}

# ------------------------------------------------------------------ Theme
# Border colors follow the active theme; regenerated by the theme picker.
# (Loaded last so it overrides the defaults in the general{} block above.)
source = ~/.config/hypr/theme.conf

# ==================== Dropdown scratchpads: terminal + notes ==================
# Super+`        -> show/hide dropdown TERMINAL  (re-spawns itself if you `exit` it)
# Super+Shift+`  -> show/hide dropdown NOTES (kwrite on ~/notes.md)
bind = $mainMod, grave,       exec, ~/.config/hypr/scripts/scratchpad.sh scratch scratch-term kitty --class scratch-term
bind = $mainMod SHIFT, grave, exec, ~/.config/hypr/scripts/scratchpad.sh notes org.kde.kwrite kwrite ~/notes.md
windowrule {
    name   = scratch-term
    match {
        class = scratch-term
    }
    float  = true
    size   = monitor_w*0.7 monitor_h*0.6
    center = true
}
windowrule {
    name   = scratch-notes
    match {
        class = org.kde.kwrite
    }
    float  = true
    size   = monitor_w*0.7 monitor_h*0.6
    center = true
}
