# ~/.config/hypr/hypridle.conf — idle management (lock, screen-off, suspend)
# Tweak the `timeout` values (in seconds) to taste.

general {
    # Switch the keyboard to English (layout 0) BEFORE locking. Otherwise a
    # lock that starts while Arabic is active takes the password in Arabic
    # and rejects it.
    lock_cmd = hyprctl switchxkblayout all 0; pidof hyprlock || hyprlock   # don't stack multiple lock screens
    before_sleep_cmd = hyprctl switchxkblayout all 0; loginctl lock-session   # English, then lock, right before sleep
    after_sleep_cmd  = hyprctl dispatch dpms on     # make sure the screen comes back on resume
}

# Idle lock + screen-off + auto-suspend all disabled for long unattended uptime.
# Screen stays on, never locks, never suspends. Lock/suspend manually via the
# power menu (SUPER+Escape). Re-add listeners below to restore timeouts.
