# AUTO-GENERATED by apply-colors.sh — edit the template there, not this file.
#
# The keyboard is switched to English before this starts (hypridle.conf), the
# current layout is printed under the password field, and SUPER+Space changes
# it while locked (bindl in hyprland.conf).
general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 9
    contrast = 0.9
    brightness = 0.38
    vibrancy = 0.0
}

# Accent stroke the whole block hangs from.
shape {
    monitor =
    size = 4, 330
    color = rgba(86734bff)
    rounding = 2
    position = 110, 10
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A")"
    color = rgba(92908eff)
    font_size = 20
    font_family = Open Sans Semibold
    position = 142, 150
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = rgba(e3e2e1ff)
    font_size = 118
    font_family = Montserrat Bold
    position = 134, 52
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%d %B %Y")"
    color = rgba(e3e2e1ff)
    font_size = 18
    font_family = Open Sans
    position = 142, -44
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 330, 48
    outline_thickness = 1
    dots_size = 0.26
    dots_spacing = 0.5
    dots_center = false
    rounding = 10
    outer_color = rgba(484644ff)
    inner_color = rgba(0f0e0dee)
    font_color  = rgba(e3e2e1ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##92908e">Password</span>
    check_color = rgba(e3e2e1ff)
    fail_color  = rgba(86734bff)
    fail_text = <span foreground="##e3e2e1">Wrong password. Check the layout below.</span>
    capslock_color = rgba(86734bff)
    position = 142, -104
    halign = left
    valign = center
}

# Which keyboard layout the password is being typed in.
label {
    monitor =
    text = $LAYOUT
    color = rgba(e3e2e1ff)
    font_size = 12
    font_family = Open Sans Semibold
    position = 144, -150
    halign = left
    valign = center
}

label {
    monitor =
    text = SUPER + Space changes the keyboard layout
    color = rgba(92908eff)
    font_size = 10
    font_family = Open Sans
    position = 144, -172
    halign = left
    valign = center
}

# The seal, bottom-right.
image {
    monitor =
    path = /home/reouii/.config/quickshell/assets/seal.png
    size = 58
    rounding = 0
    border_size = 0
    position = -70, 64
    halign = right
    valign = bottom
}

label {
    monitor =
    text = $USER
    color = rgba(92908eff)
    font_size = 11
    font_family = Open Sans Semibold
    position = -70, 40
    halign = right
    valign = bottom
}
